openapi: 3.0.3
info:
  title: RV Fitness Billing API
  description: |
    Billing & Payment Management API for RV Fitness, Narsobawadi, Maharashtra, India.
    
    ## Authentication
    All protected endpoints require a Bearer token in the Authorization header.
    
    ## Financial Conventions
    - All monetary values are in **paisa** (1 INR = 100 paisa)
    - Tax rates are in **basis points** (1800 bps = 18%)
    - Dates use ISO 8601 format
  version: 1.0.0
  contact:
    name: RV Fitness Dev Team
    email: dev@rvfitness.com

servers:
  - url: http://localhost:3000/api/v1
    description: Development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management
  - name: Members
    description: Member profiles
  - name: Invoices
    description: Invoice management
  - name: Payments
    description: Payment recording
  - name: Receipts
    description: Receipt management
  - name: Refunds
    description: Refund processing
  - name: Reports
    description: Financial reports
  - name: Reconciliation
    description: Payment reconciliation
  - name: DailyClosing
    description: Daily collection closing
  - name: Audit
    description: Financial audit trail
  - name: Settings
    description: Billing settings

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid input
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER, TRAINER]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoiceNumber:
          type: string
          example: INV-2024-0001
        memberId:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, CANCELLED, VOID]
        subtotalPaisa:
          type: integer
          format: int64
        taxPaisa:
          type: integer
          format: int64
        discountPaisa:
          type: integer
          format: int64
        totalPaisa:
          type: integer
          format: int64
        paidPaisa:
          type: integer
          format: int64
        dueDate:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        createdAt:
          type: string
          format: date-time

    InvoiceItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        quantity:
          type: integer
        unitPricePaisa:
          type: integer
          format: int64
        taxRateBps:
          type: integer
        taxPaisa:
          type: integer
          format: int64
        discountPaisa:
          type: integer
          format: int64
        totalPaisa:
          type: integer
          format: int64

    CreateInvoiceRequest:
      type: object
      required: [memberId, dueDate, items]
      properties:
        memberId:
          type: string
          format: uuid
        dueDate:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unitPricePaisa]
            properties:
              membershipId:
                type: string
                format: uuid
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitPricePaisa:
                type: integer
                format: int64
                minimum: 0
              taxRateBps:
                type: integer
                minimum: 0
                default: 0
              discountPaisa:
                type: integer
                format: int64
                minimum: 0
                default: 0
        notes:
          type: string
        internalNotes:
          type: string

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        paymentNumber:
          type: string
          example: PAY-2024-0001
        invoiceId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        amountPaisa:
          type: integer
          format: int64
        method:
          type: string
          enum: [CASH, UPI, BANK_TRANSFER, CARD, OTHER]
        status:
          type: string
          enum: [PENDING, CONFIRMED, FAILED, REVERSED]
        referenceNumber:
          type: string
        paymentDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    RecordPaymentRequest:
      type: object
      required: [invoiceId, amountPaisa, method, paymentDate]
      properties:
        invoiceId:
          type: string
          format: uuid
        amountPaisa:
          type: integer
          format: int64
          minimum: 1
        method:
          type: string
          enum: [CASH, UPI, BANK_TRANSFER, CARD, OTHER]
        referenceNumber:
          type: string
        paymentDate:
          type: string
          format: date
        notes:
          type: string
        idempotencyKey:
          type: string

    Receipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        receiptNumber:
          type: string
        paymentId:
          type: string
          format: uuid
        amountPaisa:
          type: integer
          format: int64
        issuedAt:
          type: string
          format: date-time

    Refund:
      type: object
      properties:
        id:
          type: string
          format: uuid
        refundNumber:
          type: string
        paymentId:
          type: string
          format: uuid
        amountPaisa:
          type: integer
          format: int64
        reason:
          type: string
        status:
          type: string
          enum: [REQUESTED, APPROVED, PROCESSED, REJECTED]
        method:
          type: string
          enum: [CASH, UPI, BANK_TRANSFER, CARD, ORIGINAL_METHOD, OTHER]

paths:
  /health:
    get:
      summary: Health check
      tags: [Auth]
      responses:
        '200':
          description: Service is healthy

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /invoices:
    get:
      summary: List invoices
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, CANCELLED, VOID]
        - name: memberId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Invoice list with pagination

    post:
      summary: Create invoice
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '201':
          description: Invoice created

  /invoices/{id}:
    get:
      summary: Get invoice details
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice details

  /invoices/{id}/issue:
    post:
      summary: Issue a draft invoice
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice issued

  /payments:
    get:
      summary: List payments
      tags: [Payments]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment list

    post:
      summary: Record a payment
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
      responses:
        '201':
          description: Payment recorded

  /payments/{id}/confirm:
    post:
      summary: Confirm a payment
      tags: [Payments]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment confirmed

  /receipts:
    get:
      summary: List receipts
      tags: [Receipts]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Receipt list

  /receipts/{id}/pdf:
    get:
      summary: Download receipt PDF
      tags: [Receipts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /refunds:
    get:
      summary: List refunds
      tags: [Refunds]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Refund list

    post:
      summary: Request a refund
      tags: [Refunds]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Refund requested

  /reports/summary:
    get:
      summary: Financial summary report
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Financial summary

  /reports/collections:
    get:
      summary: Collection totals by method
      tags: [Reports]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Collection breakdown

  /reports/outstanding:
    get:
      summary: Outstanding balance report
      tags: [Reports]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Outstanding balances with aging

  /audit-logs:
    get:
      summary: List audit logs
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Audit log list

  /settings:
    get:
      summary: Get all settings
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings list

    patch:
      summary: Update a setting
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Setting updated
